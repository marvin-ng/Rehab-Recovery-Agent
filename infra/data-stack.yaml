AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Rehab-Recovery-Agent Phase 1 data layer. Program + Sessions DynamoDB tables.
  No GSIs. On-demand billing. PITR + deletion protection on both tables.

Resources:

  ProgramTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: rehab-program
      BillingMode: PAY_PER_REQUEST
      # Only key attributes are declared. name/section/targetSets/targetReps/
      # perSide/cues/status/versionHistory/retiredDate/retiredReason/
      # progressedTo/progressedFrom are schemaless item attributes.
      AttributeDefinitions:
        - AttributeName: PK        # fixed partition string "PROGRAM"
          AttributeType: S
        - AttributeName: SK        # exerciseId
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: true
      Tags:
        - Key: project
          Value: rehab-recovery-agent
        - Key: phase
          Value: "1"

  SessionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: rehab-sessions
      BillingMode: PAY_PER_REQUEST
      # Only key attributes are declared. sessionId/completedExercises/
      # painRating/stiffnessRating/confidenceRating/loggedAt are schemaless.
      AttributeDefinitions:
        - AttributeName: PK        # fixed partition string "SESSION"
          AttributeType: S
        - AttributeName: SK        # session date, ISO-8601 "YYYY-MM-DD"
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: true
      Tags:
        - Key: project
          Value: rehab-recovery-agent
        - Key: phase
          Value: "1"

Outputs:
  ProgramTableName:
    Description: Physical name of the Program table
    Value: !Ref ProgramTable
    Export:
      Name: rehab-program-table-name
  SessionsTableName:
    Description: Physical name of the Sessions table
    Value: !Ref SessionsTable
    Export:
      Name: rehab-sessions-table-name
  ProgramTableArn:
    Description: ARN of the Program table
    Value: !GetAtt ProgramTable.Arn
    Export:
      Name: rehab-program-table-arn
  SessionsTableArn:
    Description: ARN of the Sessions table
    Value: !GetAtt SessionsTable.Arn
    Export:
      Name: rehab-sessions-table-arn
